<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>たねはち アニメーション</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:'Hiragino Sans','Noto Sans JP',sans-serif;background:#f6f6f6;color:#1a1b1c}
.wrap{height:100%;display:grid;place-items:center;padding:24px}
.card{width:100%;max-width:420px;background:#fff;border-radius:16px;padding:40px 36px;
  box-shadow:0 2px 8px rgba(20,30,60,.06),0 24px 60px rgba(20,30,60,.10);text-align:center}
h1{font-size:19px;font-weight:800;margin:0 0 6px;color:#1f4fa8}
p.d{font-size:13px;color:#6e727c;margin:0 0 24px;line-height:1.75}
input{width:100%;height:52px;border:2px solid #e2e6f0;border-radius:10px;padding:0 16px;font:inherit;
  font-size:16px;text-align:center;letter-spacing:.1em;outline:none}
input:focus{border-color:#1f4fa8}
button{width:100%;height:52px;margin-top:14px;border:0;border-radius:999px;background:#1f4fa8;color:#fff;
  font:inherit;font-size:15px;font-weight:800;cursor:pointer}
button[disabled]{opacity:.5;cursor:default}
.err{color:#ba1a1a;font-size:13px;font-weight:700;margin-top:14px;min-height:20px}
.cf{margin-top:26px;font-size:10.5px;letter-spacing:.14em;font-weight:800;color:#9096a1}
</style></head>
<body><div class="wrap"><div class="card">
  <h1>たねはち アニメーション</h1>
  <p class="d">合言葉を入力してください。<br>ご不明な場合は担当までお問い合わせください。</p>
  <form id="f"><input id="p" type="password" autocomplete="off" placeholder="合言葉" autofocus>
  <button id="b" type="submit">開く</button></form>
  <div class="err" id="e"></div>
  <div class="cf">CONFIDENTIAL</div>
</div></div>
<script>
var SALT = "x6DPUx3fFnFlWXIEHCjiqQ==", ITER = 150000, PW_KEY = "tanehachi_anim_pw";
var b2u = function(b){ var s=atob(b), u=new Uint8Array(s.length); for(var i=0;i<s.length;i++) u[i]=s.charCodeAt(i); return u; };
async function open_(pass){
  pass = String(pass || "").trim().toLowerCase();
  var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  var key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b2u(SALT), iterations:ITER, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  var r = await fetch("page.bin?v=mvtf7vbm");
  if(!r.ok) throw new Error("LOAD");
  var buf = new Uint8Array(await r.arrayBuffer());
  var plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:buf.slice(0,12)}, key, buf.slice(12)); // 違えば例外
  try { sessionStorage.setItem(PW_KEY, pass); } catch(_) {}
  var html = new TextDecoder().decode(plain);
  document.open(); document.write(html); document.close();
}
var f = document.getElementById("f"), b = document.getElementById("b"), e = document.getElementById("e");
f.onsubmit = async function(ev){
  ev.preventDefault(); b.disabled = true; e.textContent = ""; b.textContent = "開いています…";
  try { await open_(document.getElementById("p").value); }
  catch(err){ e.textContent = err.message === "LOAD" ? "読み込めませんでした。時間をおいて開き直してください" : "合言葉が違います";
    b.disabled = false; b.textContent = "開く"; }
};
// 同じタブで開き直したときは入力を省く
try { var s = sessionStorage.getItem(PW_KEY); if(s) open_(s).catch(function(){ sessionStorage.removeItem(PW_KEY); }); } catch(_) {}
</script></body></html>
